name: Build with Gradle

on:
  pull_request:
  workflow_dispatch:
  push:
    # Tags are built by release.yml.
    branches: ["**"]

concurrency:
  group: ${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Loom 1.19 needs a Java 25 JVM to run Gradle, and the mod targets Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # Upload the jar itself instead of a zip; the artifact takes the jar's filename.
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*.jar
          archive: false
          if-no-files-found: error
