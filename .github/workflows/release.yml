name: Release

# Push a tag starting with "v" to build the mod and publish it as a GitHub release,
# e.g. `git tag v1.0.0 && git push origin v1.0.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/libs/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NoBob $TAG" \
            --generate-notes
